<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Adapter replay repeated fixture</title>
</head>
<body data-fixture="{{FIXTURE_ID}}">
  <main>
    <h1>Adapter replay repeated fixture</h1>
    <form method="post" action="/submit?taskId={{TASK_ID}}">
      <section id="education-section">
        <h2>教育经历</h2>
        <button id="add-education" type="button">添加</button>
        <div id="education-entries"></div>
      </section>
      <label for="replay-unrelated">Unrelated sentinel<input id="replay-unrelated" name="fixture.unrelated" data-replay-key="unrelatedSentinel" value="UNCHANGED"></label>
      <button type="submit">Submit application</button>
    </form>
  </main>
  <script>
    const taskId = "{{TASK_ID}}";
    const writeCounts = {};
    const repeatedOrder = [];
    const values = () => Object.fromEntries(
      [...document.querySelectorAll("[data-replay-key]")]
        .map((control) => [control.dataset.replayKey, control.value])
    );
    const sync = () => fetch(`/api/adapter-replay-state?taskId=${encodeURIComponent(taskId)}`, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ values: values(), writeCounts, readbackSnapshots: [values()], repeatedOrder })
    });
    const bind = (control) => {
      if (control.dataset.replayBound === "1") return;
      control.dataset.replayBound = "1";
      control.addEventListener("input", () => {
        const key = control.dataset.replayKey;
        writeCounts[key] = (writeCounts[key] || 0) + 1;
        void sync();
      });
    };
    document.querySelectorAll("[data-replay-key]").forEach(bind);
    document.querySelector("#add-education").addEventListener("click", () => {
      document.querySelector("#add-education").remove();
      setTimeout(() => {
        document.querySelector("#education-entries").innerHTML = '<label for="replay-school">School<input id="replay-school" name="fixture.school" data-replay-key="school"></label>';
        repeatedOrder.push("education");
        bind(document.querySelector("#replay-school"));
        void sync();
      }, 1_000);
    }, { once: true });
    void sync();
  </script>
</body>
</html>
