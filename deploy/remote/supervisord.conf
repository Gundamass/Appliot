[unix_http_server]
file=%(ENV_RESUME_AI_ROOT)s/run/supervisor.sock
chmod=0600

[supervisord]
logfile=%(ENV_RESUME_AI_ROOT)s/logs/supervisord.log
logfile_maxbytes=20MB
logfile_backups=5
pidfile=%(ENV_RESUME_AI_ROOT)s/run/supervisord.pid
childlogdir=%(ENV_RESUME_AI_ROOT)s/logs
nodaemon=false
minfds=1024
umask=077

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(ENV_RESUME_AI_ROOT)s/run/supervisor.sock

[program:resume-embedding]
command=%(ENV_RESUME_AI_ROOT)s/services/bin/run-embedding.sh
directory=%(ENV_RESUME_AI_ROOT)s
autostart=true
autorestart=unexpected
startsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=%(ENV_RESUME_AI_ROOT)s/logs/embedding.stdout.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stderr_logfile=%(ENV_RESUME_AI_ROOT)s/logs/embedding.stderr.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=5

[program:resume-ocr]
command=%(ENV_RESUME_AI_ROOT)s/services/bin/run-ocr.sh
directory=%(ENV_RESUME_AI_ROOT)s
autostart=true
autorestart=unexpected
startsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=%(ENV_RESUME_AI_ROOT)s/logs/ocr.stdout.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stderr_logfile=%(ENV_RESUME_AI_ROOT)s/logs/ocr.stderr.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=5
